<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="%COLOR%" />
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json" />
    <title>🫦 stashhub</title>

    <!-- Never surface this instance to search engines or crawlers. -->
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
    />
    <meta name="googlebot" content="noindex, nofollow" />

    <!-- Open Graph: only affects link-preview cards (Discord/Slack/iMessage
         etc), unrelated to search indexing, which the robots tags above and
         the server's X-Robots-Tag header + robots.txt handle. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="stashhub" />
    <meta property="og:title" content="🫦 stashhub" />
    <meta
      property="og:description"
      content="A private, self-hosted library for organizing and streaming adult content, with a TikTok-style vertical feed, smart tagging, performer and studio metadata, and a learning algorithm that adapts to what you actually watch."
    />
    <meta property="og:image" content="%OG_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%OG_URL%/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🫦 stashhub" />
    <meta
      name="twitter:description"
      content="A private, self-hosted library for organizing and streaming adult content, with a TikTok-style vertical feed, smart tagging, performer and studio metadata, and a learning algorithm that adapts to what you actually watch."
    />
    <meta name="twitter:image" content="%OG_URL%/og-image.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
