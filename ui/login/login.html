<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/%BASE_URL%/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>🫦 stashhub</title>

    <!-- This login page is what any unauthenticated visitor (including
         crawlers and link-preview bots) actually receives, so the robots and
         OG tags live here too, not only on the post-login app shell. -->
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
    />
    <meta name="googlebot" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="stashhub" />
    <meta property="og:title" content="🫦 stashhub" />
    <meta
      property="og:description"
      content="A private, self-hosted library for organizing and streaming adult content, with a TikTok-style vertical feed, smart tagging, performer and studio metadata, and a learning algorithm that adapts to what you actually watch."
    />
    <meta property="og:image" content="%OG_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%OG_URL%/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🫦 stashhub" />
    <meta
      name="twitter:description"
      content="A private, self-hosted library for organizing and streaming adult content, with a TikTok-style vertical feed, smart tagging, performer and studio metadata, and a learning algorithm that adapts to what you actually watch."
    />
    <meta name="twitter:image" content="%OG_URL%/og-image.png" />

    <link rel="shortcut icon" type="image/png" href="login/favicon.png">
    <link rel="stylesheet" href="login/login.css">
    <link rel="stylesheet" href="css">
</head>
<body class="login">

    <div class="dialog">
        <div class="card">
            <form action="login" method="POST">
                <div class="form-group">
                    <label for="username"><h6>Username</h6></label>
                    <input class="text-input form-control" id="username" name="username" type="text" placeholder="Username" />
                </div>
                <div class="form-group">
                    <label for="password"><h6>Password</h6></label>
                    <input class="text-input form-control" id="password" name="password" type="password" placeholder="Password" />
                </div>
                <div class="login-error">{{- .Error -}}</div>

                <input type="hidden" name="returnURL" value="{{.URL}}" />

                <div>
                    <input class="btn btn-primary" type="submit" value="Login">
                </div>
            </form>
        </div>
    </div>

</body>
</html>
